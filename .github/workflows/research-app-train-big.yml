name: Research app (big model paragraph reading on a free Kaggle graphics card)

# The app's big model (Qwen3 4B) is trained on paragraph comprehension only: human-made, five-option
# questions with a passage (research-app/train/big_read.py; ChatGPT's guide: research-app/train/BUYUK-MODEL.md).
# Free: Kaggle gives 30 card hours a week. Only a small add-on (LoRA) is trained; it goes to a separate
# private Hugging Face repository (orbis-qwen3-4b-<kernel>). The model file the app downloads is not touched.
#   smoke   - build the questions on this machine and print counts, before Kaggle hours are spent
#   start   - send the round to Kaggle and wait for it
#   collect - fetch the result of a round that outlasted the wait
on:
  push:
    branches: [anlam-okuma]
    paths:
      - .github/workflows/research-app-train-big.yml
      - research-app/train/big_read.py
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke, start or collect"
        default: "smoke"
      minutes:
        description: "training minutes (0 = exam only: the starting score)"
        default: "15"
      start:
        description: "continue from an earlier round's add-on, its private Hugging Face repository name (e.g. orbis-qwen3-4b-buyuk-okuma-1); empty = the model as published"
        default: ""
      kernel:
        description: "Kaggle notebook name; also names the result repository. A new name for each round, e.g. orbis-buyuk-okuma-2"
        default: "orbis-buyuk-okuma-1"
      seed:
        description: "order of the training questions (a number)"
        default: "3"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DATASET: orbis-big-data
      KERNEL: ${{ inputs.kernel || 'orbis-buyuk-okuma-1' }}
      MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trial on this machine
        if: env.MODE == 'smoke'
        run: |
          pip install --quiet pandas pyarrow huggingface_hub
          cd research-app/train
          python -m py_compile big_read.py
          python big_read.py data > out.txt 2> err.txt || { echo "::error title=Trial::$(tail -c 1500 err.txt | tr '\n' '|' | sed 's/|/%0A/g')"; exit 1; }
          echo "::notice title=Trial::$(head -c 3500 out.txt | tr '\n' '|' | sed 's/|/%0A/g')"

      - name: Kaggle key
        if: env.MODE != 'smoke'
        run: |
          pip install --quiet --upgrade kaggle "huggingface_hub>=0.34"
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          if [ -z "$KAGGLE_USERNAME" ]; then
            unset KAGGLE_USERNAME
            python - > who.txt 2> who-err.txt <<'EOF'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          print(api.config_values.get("username") or getattr(api, "username", "") or "")
          EOF
            name=$(tr -d '[:space:]' < who.txt)
            [ -n "$name" ] || { echo "::error title=Kaggle::could not find the user name from the key: $(tail -c 400 who-err.txt | tr '\n' ' ')"; exit 1; }
            echo "KAGGLE_USERNAME=$name" >> "$GITHUB_ENV"
          fi

      - name: Send the round to Kaggle
        if: env.MODE == 'start'
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          mkdir -p kd
          if [ -n "${{ inputs.start }}" ]; then
            # The earlier add-on is private: fetched here and handed to Kaggle in the private dataset,
            # so the Hugging Face key never goes to Kaggle.
            python - <<'EOF'
          import os, shutil
          from huggingface_hub import HfApi, snapshot_download
          repo = HfApi().whoami()["name"] + "/" + "${{ inputs.start }}"
          d = snapshot_download(repo, local_dir="start-model")
          for f in os.listdir(d):
              if os.path.isfile(os.path.join(d, f)) and not f.startswith("."):
                  shutil.copy(os.path.join(d, f), os.path.join("kd", "start__" + f))
          print(f"::notice title=Start::the round starts from {repo}")
          EOF
          fi
          echo "${{ github.run_id }} start=${{ inputs.start }}" > kd/big_round.txt
          echo "${{ inputs.minutes }}" > kd/minutes.txt
          echo "${{ inputs.start }}" > kd/start.txt
          echo "${{ inputs.seed }}" > kd/seed.txt
          printf '{"title": "%s", "id": "%s/%s", "licenses": [{"name": "other"}]}' "$DATASET" "$KAGGLE_USERNAME" "$DATASET" > kd/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/$DATASET" > /dev/null 2>&1; then
            kaggle datasets version -p kd -m "update" -q
          else
            kaggle datasets create -p kd -q
          fi
          # "ready" can still describe the previous version; wait until Kaggle serves this run's mark.
          ok=0
          for i in $(seq 1 60); do
            sleep 20
            mkdir -p chk && rm -f chk/big_round.txt chk/*.zip
            kaggle datasets download "$KAGGLE_USERNAME/$DATASET" -f big_round.txt -p chk -q --force > /dev/null 2>&1 || true
            [ -f chk/big_round.txt.zip ] && (cd chk && unzip -o -q big_round.txt.zip) || true
            if [ -f chk/big_round.txt ] && grep -q "^${{ github.run_id }} " chk/big_round.txt; then ok=1; break; fi
            echo "waiting for the new dataset version ($i)"
          done
          [ "$ok" = 1 ] || { echo "::error title=Kaggle::the new dataset version did not appear in 20 minutes"; exit 1; }
          sleep 30
          mkdir -p kk && cp research-app/train/big_read.py kk/
          cat > kk/kernel-metadata.json <<EOF
          {"id": "$KAGGLE_USERNAME/$KERNEL", "title": "$KERNEL", "code_file": "big_read.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true, "machine_shape": "NvidiaTeslaT4",
           "dataset_sources": ["$KAGGLE_USERNAME/$DATASET"], "competition_sources": [], "kernel_sources": []}
          EOF
          kaggle kernels push -p kk
          echo "::notice title=Kaggle::the round was sent ($(date -u +%H:%M) UTC)"

      - name: Wait for the round
        if: env.MODE == 'start'
        id: wait
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 120
            s=$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL" 2>&1 || true)
            echo "$(date -u +%H:%M) $s"
            if echo "$s" | grep -qiE 'complete|error|cancel'; then echo "done=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::notice title=Kaggle::still running; run this again with mode collect later"

      - name: Collect the result
        if: env.MODE == 'collect' || steps.wait.outputs.done == '1'
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          s=$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL" 2>&1 || true)
          if ! echo "$s" | grep -qiE 'complete|error|cancel'; then echo "::notice title=Kaggle::still running: $s"; exit 0; fi
          mkdir -p res && kaggle kernels output "$KAGGLE_USERNAME/$KERNEL" -p res -q || true
          python - <<'EOF'
          import glob, json, os
          from huggingface_hub import HfApi
          notes = open("res/notes.txt", encoding="utf-8").read().strip() if os.path.exists("res/notes.txt") else ""
          log = "".join(open(f, encoding="utf-8", errors="replace").read() for f in glob.glob("res/*.log"))
          if not notes:
              print(log[-6000:])
              print("::error title=Kaggle::the round left no notes; the end of its log is printed above")
              raise SystemExit(1)
          print("::notice title=Reading::" + notes.replace("\n", "%0A")[:8000])
          status = json.load(open("res/status.json")) if os.path.exists("res/status.json") else {}
          if not status.get("ok"):
              print("::error title=Kaggle log::" + log[-3500:].replace("\n", "%0A"))
              raise SystemExit(1)
          if os.path.exists("res/out/adapter_config.json"):
              api = HfApi()
              repo = api.whoami()["name"] + "/orbis-qwen3-4b-" + os.environ["KERNEL"].replace("orbis-", "")
              api.create_repo(repo, private=True, exist_ok=True)
              api.upload_folder(repo_id=repo, folder_path="res/out", commit_message=f"paragraph round: {status['before']:.3f} -> {status['after']:.3f}")
              print(f"::notice title=Saved::kept in the private repository {repo}")
          EOF
