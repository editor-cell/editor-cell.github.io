name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.html"
      - robots.txt
      - sitemap.xml
      - feed.xml
      - read/**
      - media/**
      - .site-output.json
      - tr/**
      - ar/**
      - fr/**
      - es/**
      - favicon.svg
      - og.jpg
      - .nojekyll
      - assets/**
      - __grok/**
  workflow_dispatch:

# Queue every run (default single-pending concurrency would cancel queued saves).
concurrency:
  group: orbis-publish-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # A type error stops the publish here, before anything reaches the live site.
      - name: Check the code
        run: npm run typecheck
      - name: Run the tests
        run: npm run test:site
      - run: npm run build:pages
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check reader controls and appearance
        run: npm run test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            artifacts/browser
            artifacts/browser-report
      - name: Place the site at the repository root
        run: |
          node scripts/publish-output.mjs --stage
          git config user.name "editor-cell"
          git config user.email "editor@orbisreadingatlas.com"
          node scripts/finish-publish.mjs
