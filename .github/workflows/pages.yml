name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.html"
      - robots.txt
      - sitemap.xml
      - feed.xml
      - _redirects
      - read/**
      - media/**
      - .site-output.json
      - tr/**
      - ar/**
      - fr/**
      - es/**
      - favicon.svg
      - og.jpg
      - .nojekyll
      - assets/**
      - __grok/**
  workflow_dispatch:

# Queue every run (default single-pending concurrency would cancel queued saves).
concurrency:
  group: orbis-publish-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  publish:
    # A fixed machine: a new Ubuntu reaches this site only when this line is changed on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A type error stops the publish here, before anything reaches the live site.
      - name: Check the code
        run: npm run typecheck
      - name: Run the tests
        run: npm run test:site
      - run: npm run build:pages
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The look comparison (npm run test:browser) left the publish on 13 Oct 2026 at the
      # owner's request: too slow for what it caught. It can still be run by hand.
      # This week's real readings, every page, phone and desktop: nothing may stick out,
      # run out of its box, fail to load or report an error.
      - name: Check every page of the built site
        run: npm run test:pages
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure
          path: |
            .browser-check/out
            artifacts/browser
            artifacts/browser-report
      - name: Place the site at the repository root
        run: |
          node scripts/publish-output.mjs --stage
          git config user.name "editor-cell"
          git config user.email "editor@orbisreadingatlas.com"
          node scripts/finish-publish.mjs
