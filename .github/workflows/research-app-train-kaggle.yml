name: Research app (Quran reading on a free Kaggle graphics card)

# The NLI model reads the Quran eleven times on Kaggle's free graphics card, then is trained on our
# own examples as every round (research-app/train/kaggle_read.py). Free: Kaggle gives 30 card hours
# a week. The training files go to a private Kaggle dataset; the Quran texts are fetched on Kaggle
# while the reading runs and are never stored here. The result goes to a separate private Hugging
# Face repository (orbis-nli-mdeberta-quran); the model the app uses is not touched.
#   smoke   - a few pairs on this machine, to catch mistakes before Kaggle hours are spent
#   start   - send the reading to Kaggle and wait for it (up to about five and a half hours)
#   collect - fetch the result of a reading that outlasted the wait
on:
  push:
    branches: [anlam-okuma]
    paths:
      - .github/workflows/research-app-train-kaggle.yml
      - research-app/train/kaggle_read.py
      - research-app/train/quran.py
      - research-app/train/human.py
  workflow_dispatch:
    inputs:
      mode:
        default: "smoke"
      readings:
        default: "11"
      hours:
        default: "7"
      human:
        description: "1 = add the human-made pairs (PAWS, Tatoeba)"
        default: "0"
      kernel:
        description: "Kaggle notebook name; a new name for a round that must not replace a running one"
        default: "orbis-kuran-okuma"
      program:
        description: "kaggle_read.py (Quran and full round) or fast_problems.py (quick word-problem round)"
        default: "kaggle_read.py"
      focus:
        description: "for fast_problems.py: problem or logic"
        default: "problem"
      minutes:
        description: "for fast_problems.py: stop training after this many minutes (empty = no limit)"
        default: ""
      start:
        description: "start from this earlier round's private Hugging Face model (e.g. orbis-nli-mdeberta-quran); empty = the original model"
        default: ""

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DATASET: orbis-train-data
      KERNEL: ${{ inputs.kernel || 'orbis-kuran-okuma' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gather the training files (flat, as Kaggle keeps them)
        run: |
          mkdir -p kd
          cp research-app/train/{train_nli.py,pool.json,quran.py,human.py,kaggle_read.py,fast_problems.py,sudoku.py,sudoku_methods.py} kd/
          [ -f research-app/train/labels/agreed.json ] && cp research-app/train/labels/agreed.json kd/labels__agreed.json || true
          for f in research-app/train/labels/*.jsonl; do cp "$f" "kd/labels__$(basename "$f")"; done
          cp research-app/nli-trial/cases.json kd/
          ls kd | wc -l

      - name: Trial on this machine
        if: (inputs.mode || 'smoke') == 'smoke'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet pandas pyarrow
          cd kd
          pip install --quiet huggingface_hub
          python sudoku.py 2> err.txt | sed 's/^/::notice title=Sudoku::/' || { echo "::error title=Sudoku::$(tail -c 1500 err.txt | tr '\n' '|' | sed 's/|/%0A/g')"; exit 1; }
          python sudoku_methods.py real 2> err.txt | head -c 6000 | tr '\n' '|' | sed 's/|/%0A/g; s/^/::notice title=SudokuMethods::/' || { echo "::error title=SudokuMethods::$(tail -c 1500 err.txt | tr '\n' '|' | sed 's/|/%0A/g')"; exit 1; }
          SMOKE=1 READINGS=2 python kaggle_read.py 2> err.txt || { echo "::error title=Trial::$(tail -c 1500 err.txt | tr '\n' '|' | sed 's/|/%0A/g')"; exit 1; }
          echo "::notice title=Trial::$(tr '\n' '|' < work/notes.txt | sed 's/|/%0A/g')"
          python -c "import human; r = human.build(40, 30, 'work/human-cache'); print(len(r), r[:3])" 2> err.txt || { echo "::error title=Human::$(tail -c 1500 err.txt | tr '\n' '|' | sed 's/|/%0A/g')"; exit 1; }
          python -c "
          import human, random
          r = human.build(60, 300, 'work/human-cache')
          rows = [x for x in r if x['tr']][:14] + [x for x in r if x['en']][:6]
          print('::notice title=Human::' + '%0A'.join(x['label'] + ' | ' + x['premise'][:120] + ' => ' + (x['tr'] or x['en'])[:120] for x in rows))
          "

      - name: Kaggle key
        if: (inputs.mode || 'smoke') != 'smoke'
        run: |
          pip install --quiet --upgrade kaggle "huggingface_hub>=0.34"
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          if [ -z "$KAGGLE_USERNAME" ]; then
            # The new kind of key carries the account: ask Kaggle whose it is.
            unset KAGGLE_USERNAME
            python - > who.txt 2> who-err.txt <<'EOF'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          print(api.config_values.get("username") or getattr(api, "username", "") or "")
          EOF
            name=$(tr -d '[:space:]' < who.txt)
            if [ -z "$name" ]; then
              kaggle config view 2>&1 | head -20
              echo "::error title=Kaggle::could not find the user name from the key: $(tail -c 400 who-err.txt | tr '\n' ' ')"; exit 1
            fi
            echo "KAGGLE_USERNAME=$name" >> "$GITHUB_ENV"
            export KAGGLE_USERNAME="$name"
          fi
          if ! kaggle datasets list --mine > /dev/null 2>err.txt; then
            echo "::error title=Kaggle::the Kaggle key did not work: $(tail -c 400 err.txt | tr '\n' ' ')"; exit 1
          fi
          echo "::notice title=Kaggle::the key works for $KAGGLE_USERNAME"

      - name: Send the reading to Kaggle
        if: inputs.mode == 'start'
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          if [ -n "${{ inputs.start }}" ]; then
            # The earlier model is private: fetched here with the Hugging Face key and handed to Kaggle
            # in the private dataset, so the key never goes to Kaggle.
            python - <<'EOF'
          import os, shutil
          from huggingface_hub import HfApi, snapshot_download
          repo = HfApi().whoami()["name"] + "/" + "${{ inputs.start }}"
          d = snapshot_download(repo, local_dir="start-model")
          for f in os.listdir(d):
              if os.path.isfile(os.path.join(d, f)) and not f.startswith("."):
                  shutil.copy(os.path.join(d, f), os.path.join("kd", "start__" + f))
          print(f"::notice title=Start::the round starts from {repo}")
          EOF
            ls -la kd | grep start__
          fi
          # A mark of this run: the round on Kaggle checks it has this run's files, not an older version.
          echo "${{ github.run_id }} start=${{ inputs.start }}" > kd/round.txt
          echo "${{ inputs.focus }}" > kd/focus.txt
          echo "${{ inputs.minutes }}" > kd/minutes.txt
          printf '{"title": "%s", "id": "%s/%s", "licenses": [{"name": "other"}]}' "$DATASET" "$KAGGLE_USERNAME" "$DATASET" > kd/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/$DATASET" > /dev/null 2>&1; then
            kaggle datasets version -p kd -m "update" -q
          else
            kaggle datasets create -p kd -q
          fi
          # "ready" can still describe the previous version; wait until Kaggle serves this run's mark.
          ok=0
          for i in $(seq 1 60); do
            sleep 20
            mkdir -p chk && rm -f chk/round.txt
            kaggle datasets download "$KAGGLE_USERNAME/$DATASET" -f round.txt -p chk -q --force > /dev/null 2>&1 || true
            [ -f chk/round.txt.zip ] && (cd chk && unzip -o -q round.txt.zip) || true
            if [ -f chk/round.txt ] && grep -q "^${{ github.run_id }} " chk/round.txt; then ok=1; echo "dataset version of this run is ready"; break; fi
            echo "waiting for the new dataset version ($i)"
          done
          if [ "$ok" != 1 ]; then echo "::error title=Kaggle::the new dataset version did not appear in 20 minutes"; exit 1; fi
          sleep 30
          mkdir -p kk
          sed -e 's/os.environ.get("READINGS", "11")/os.environ.get("READINGS", "${{ inputs.readings || '11' }}")/' \
              -e 's/os.environ.get("HOURS", "7")/os.environ.get("HOURS", "${{ inputs.hours || '7' }}")/' \
              -e 's/os.environ.get("HUMAN", "0")/os.environ.get("HUMAN", "${{ inputs.human || '0' }}")/' \
              research-app/train/kaggle_read.py > kk/kaggle_read.py
          p="${{ inputs.program }}"
          if [ -n "$p" ] && [ "$p" != "kaggle_read.py" ]; then cp "research-app/train/$p" kk/kaggle_read.py; fi
          cat > kk/kernel-metadata.json <<EOF
          {"id": "$KAGGLE_USERNAME/$KERNEL", "title": "$KERNEL", "code_file": "kaggle_read.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true, "machine_shape": "NvidiaTeslaT4",
           "dataset_sources": ["$KAGGLE_USERNAME/$DATASET"], "competition_sources": [], "kernel_sources": []}
          EOF
          kaggle kernels push -p kk
          echo "::notice title=Kaggle::the reading was sent ($(date -u +%H:%M) UTC)"

      - name: Wait for the reading
        if: inputs.mode == 'start'
        id: wait
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 120
            s=$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL" 2>&1 || true)
            echo "$(date -u +%H:%M) $s"
            if echo "$s" | grep -qiE 'complete|error|cancel'; then echo "done=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::notice title=Kaggle::still reading after five and a half hours; run this again with mode collect later"

      - name: Collect the result
        if: inputs.mode == 'collect' || steps.wait.outputs.done == '1'
        run: |
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          s=$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL" 2>&1 || true)
          echo "$s"
          if ! echo "$s" | grep -qiE 'complete|error|cancel'; then echo "::notice title=Kaggle::still running: $s"; exit 0; fi
          mkdir -p res && kaggle kernels output "$KAGGLE_USERNAME/$KERNEL" -p res -q || true
          ls -R res | head -30
          python - <<'EOF'
          import glob, json, os
          from huggingface_hub import HfApi
          notes = open("res/notes.txt", encoding="utf-8").read().strip() if os.path.exists("res/notes.txt") else ""
          if not notes:
              log = "".join(open(f, encoding="utf-8", errors="replace").read() for f in glob.glob("res/*.log"))
              print(log[-6000:])
              print("::error title=Kaggle::the reading left no notes; the end of its log is printed above")
              raise SystemExit(1)
          print("::notice title=Reading::" + notes.replace("\n", "%0A")[:8000])
          status = json.load(open("res/status.json")) if os.path.exists("res/status.json") else {}
          if not status.get("ok"):
              log = "".join(open(f, encoding="utf-8", errors="replace").read() for f in glob.glob("res/*.log"))
              try:  # Kaggle keeps the log as JSON lines of {"data": ...}
                  log = "".join(json.loads("[" + log.strip().strip(",") + "]")[i]["data"] for i in range(len(json.loads("[" + log.strip().strip(",") + "]"))))
              except Exception:
                  pass
              print("::error title=Kaggle log::" + log[-3500:].replace("\n", "%0A"))
          if status.get("ok") and os.path.exists("res/out/config.json"):
              api = HfApi()
              repo = api.whoami()["name"] + "/orbis-nli-" + os.environ["KERNEL"].replace("orbis-", "")
              api.create_repo(repo, private=True, exist_ok=True)
              api.upload_folder(repo_id=repo, folder_path="res/out", commit_message=f"read the Quran {status['readings']} times, then our examples")
              print(f"::notice title=Saved::kept in the private repository {repo}")
          EOF
