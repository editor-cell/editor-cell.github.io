name: Research app (APK)
on:
  push:
    branches: [main, ccr-b3ffb058-472a31, anlam-okuma]
    paths:
      - research-app/**
      - .github/workflows/research-app.yml
  workflow_dispatch:
concurrency:
  group: research-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'anlam-okuma' || contains(github.event.head_commit.message, '[android-latest-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" > /dev/null
      - name: Fetch and build the meaning-search engine for host checks
        run: |
          ./fetch-llama.sh
          cmake -S app/src/main/cpp -B build-host -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF > /dev/null
          cmake --build build-host -j4 --target orbisllm
      - name: Build the exact trained tokenizer for host and Android
        run: |
          rustup target add aarch64-linux-android
          cargo build --manifest-path tokenizer-native/Cargo.toml --release
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384' cargo build --manifest-path tokenizer-native/Cargo.toml --target aarch64-linux-android --release --locked
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp tokenizer-native/target/aarch64-linux-android/release/liborbistokenizer.so app/src/main/jniLibs/arm64-v8a/
      - uses: actions/cache@v4
        with:
          path: ~/test-embed
          key: test-embed-e5-small-q8_0
      - name: Fetch the public meaning-search model
        run: |
          mkdir -p ~/test-embed
          e=~/test-embed/multilingual-e5-small-q8_0.gguf
          [ -s "$e" ] || curl -fsSL -o "$e" https://github.com/editor-cell/editor-cell.github.io/releases/download/models-1/multilingual-e5-small-q8_0.gguf
      - name: Fetch and verify only the current private trained model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install 'huggingface_hub<1'
          python train/fetch_android_test_model.py "$RUNNER_TEMP/orbis-nli"
      - name: Test reading logic, meaning search, exact tokenizer and trained model parity
        run: |
          export ORBIS_LIB="$PWD/build-host/liborbisllm.so"
          export ORBIS_EMBED=~/test-embed/multilingual-e5-small-q8_0.gguf
          export ORBIS_TOKENIZER_LIB="$PWD/tokenizer-native/target/release/liborbistokenizer.so"
          export ORBIS_NLI_MODEL="$RUNNER_TEMP/orbis-nli/model"
          ./gradlew -p logic-test test --no-daemon
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('logic-test/build/test-results/test/TEST-NliRuntimeTest.xml')
          root=ET.parse(p).getroot()
          assert int(root.attrib['tests']) == 2 and int(root.attrib.get('skipped',0)) == 0
          assert int(root.attrib.get('failures',0)) == 0 and int(root.attrib.get('errors',0)) == 0
          PY
      - name: Build and inspect the signed APK
        run: |
          export BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk orbis-arastirma.apk
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('orbis-arastirma.apk') as z:
              names=set(z.namelist())
              assert 'assets/nli_model.json' in names
              assert 'lib/arm64-v8a/liborbistokenizer.so' in names
              assert 'lib/arm64-v8a/libonnxruntime.so' in names
              assert not any(n.endswith(('.onnx','.gguf','.safetensors')) for n in names)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose orbis-arastirma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-arastirma-apk
          path: research-app/orbis-arastirma.apk
      - name: Publish the APK for the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="arastirma-v0.1.$BUILD_NUMBER"
          gh release create "$tag" orbis-arastirma.apk --target "${{ github.sha }}" \
            --title "Orbis Araştırma 0.1.$BUILD_NUMBER · son eğitilmiş model" \
            --notes-file ANDROID-TRIAL.md --latest
