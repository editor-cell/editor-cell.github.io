name: Research app (APK)

# Builds the Orbis Araştırma Android app and puts the APK on a release page the owner can open
# from the phone. It never touches the site: the site is published only by "Publish site".
on:
  push:
    branches: [main, ccr-b3ffb058-472a31]
    paths:
      - research-app/**
      - .github/workflows/research-app.yml
  workflow_dispatch:

concurrency:
  group: research-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Every model the app offers must still be downloadable where the app looks for it.
      - name: Check the model addresses
        run: |
          grep -oE 'https://(huggingface\.co|github\.com)/[^"]+\.gguf' app/src/main/java/com/orbis/research/Models.kt | while read -r url; do
            code=$(curl -s -o /dev/null -I -L -w '%{http_code}' "$url")
            echo "$code $url"
            [ "$code" = "200" ] || exit 1
          done

      - name: Install the Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" > /dev/null

      - name: Fetch the language model engine (llama.cpp)
        run: ./fetch-llama.sh

      # The app's bridge to llama.cpp, built for this machine, so the tests can run the real model.
      - name: Build the model bridge for the tests
        run: |
          cmake -S app/src/main/cpp -B build-host -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF > /dev/null
          cmake --build build-host -j4 --target orbisllm

      - uses: actions/cache@v4
        with:
          path: ~/test-model
          key: test-models-qwen3-4b-q4_k_m-e5-small-q8_0

      - name: Fetch the models for the tests
        run: |
          mkdir -p ~/test-model
          f=~/test-model/Qwen3-4B-Q4_K_M.gguf
          [ -s "$f" ] || curl -fsSL -o "$f" https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
          e=~/test-model/multilingual-e5-small-q8_0.gguf
          [ -s "$e" ] || curl -fsSL -o "$e" https://github.com/editor-cell/editor-cell.github.io/releases/download/models-1/multilingual-e5-small-q8_0.gguf
          ls -la ~/test-model

      # Source lists, robots.txt, reading pages and PDFs; then the app's prompts on the big model
      # (paragraphs labelled right, a stop within a second, a digit-free direction) and the meaning
      # model (English paragraphs that say what a Turkish claim says, in other words, rank first).
      - name: Test the reading logic and the models
        run: |
          export ORBIS_LIB="$PWD/build-host/liborbisllm.so" ORBIS_MODEL=~/test-model/Qwen3-4B-Q4_K_M.gguf
          export ORBIS_EMBED=~/test-model/multilingual-e5-small-q8_0.gguf
          status=0
          ./gradlew -p logic-test test --no-daemon || status=$?
          # The score card is also left as notes on the run, readable without the log.
          python3 ../.github/scripts/model-score.py logic-test/build/test-results/test | tee score.txt || true
          grep -E '^(FAIL|SCORE)' score.txt | head -40 | while IFS= read -r line; do echo "::warning::$line"; done || true
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          for p in glob.glob("logic-test/build/test-results/test/TEST-*.xml"):
              for c in ET.parse(p).getroot().iter("testcase"):
                  f = c.find("failure")
                  if f is not None:
                      msg = (f.get("message") or "").replace("\n", " ")[:300]
                      print(f"::error::{c.get('classname')} {c.get('name')[:80]}: {msg}")
          PY
          exit $status

      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk orbis-arastirma.apk
          ls -la orbis-arastirma.apk
          unzip -l orbis-arastirma.apk | grep -E '\.so$'

      - uses: actions/upload-artifact@v4
        with:
          name: orbis-arastirma-apk
          path: research-app/orbis-arastirma.apk

      - name: Put the APK on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="arastirma-v0.1.${{ github.run_number }}"
          gh release create "$tag" orbis-arastirma.apk \
            --target "${{ github.sha }}" \
            --title "Orbis Araştırma 0.1.${{ github.run_number }}" \
            --notes "Telefona kurmak için aşağıdaki orbis-arastirma.apk dosyasına dokunun."
