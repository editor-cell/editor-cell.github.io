name: Research app (visual review)
on:
  push:
    branches: [anlam-okuma]
    paths:
      - research-app/app/**
      - research-app/ui-review/**
      - .github/workflows/research-app-ui.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-review-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[ui-preview]') && 'preview' || github.run_id }}
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui-preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the UI-only review APK
        working-directory: research-app
        env:
          BUILD_NUMBER: '999999'
        run: |
          ./gradlew -PuiReview=true assembleDebug --no-daemon
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              assert not any(n.endswith('.so') for n in z.namelist())
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python research-app/ui-review/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbis-visual-review
          path: ui-review-output/
          if-no-files-found: ignore
